name: Update prices and publish site

on:
  schedule:
    - cron: "23 2,14 * * *"          # twice a day (UTC)
  workflow_dispatch:
    inputs:
      crawl_minutes:
        description: "Minutes to spend crawling shop pages (0 = only re-read feeds)"
        default: "290"
  push:
    branches: [master]
    paths: ["airsoftcompare/**", "shops.yaml", "requirements.txt", ".github/workflows/update.yml"]

concurrency:
  group: update-and-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355             # GitHub's limit is 6 h; crawling stops on its own before that
    env:
      AIRSOFT_DB: ${{ github.workspace }}/data/airsoft.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The database (offers, price history, crawl progress) lives in the Actions cache between runs.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: airsoft-db-${{ github.run_id }}
          restore-keys: airsoft-db-

      - name: Download prices
        if: github.event_name != 'push'
        run: |
          mkdir -p data
          python -m airsoftcompare update --batch --max-minutes "${{ github.event.inputs.crawl_minutes || '290' }}"

      - name: Save database
        if: always() && github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: data/
          key: airsoft-db-${{ github.run_id }}

      - name: Build site
        run: mkdir -p data && python -m airsoftcompare export dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: wrangler pages project create compairsoft --production-branch=main || true
          command: pages deploy dist --project-name=compairsoft --branch=main --commit-dirty=true
