name: Update prices and publish site

on:
  # The timer is a Cloudflare Worker (scheduler/worker.js) that starts this workflow at 00:17, 05:17,
  # 10:17, 15:17 and 20:17 UTC: GitHub's own schedule is often late by hours or skipped. GitHub's
  # schedule stays as a backup and steps aside (see "gate") when the Worker's run already happened.
  schedule:
    # Five runs a day while the crawled shops fill up; each crawls up to ~4h50m, so this is nearly
    # continuous. Pages read in the last 20 h are skipped, so once caught up a run takes minutes.
    # Back to twice a day later:  - cron: "23 2,14 * * *"  (and the Worker's cron too)
    - cron: "23 0,5,10,15,20 * * *"
  workflow_dispatch:
    inputs:
      crawl_minutes:
        description: "Minutes to spend crawling shop pages (0 = only re-read feeds; at most 220 so photos and translations fit in the 6 h limit)"
        default: "220"
  push:
    branches: [master, "preview/**"]   # preview/* branches publish to a separate preview address
    paths: ["airsoftcompare/**", "shops.yaml", "requirements.txt", ".github/workflows/update.yml"]

concurrency:
  group: update-and-publish-${{ github.ref }}   # previews don't wait for (or hold up) the live site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # GitHub's late schedule must not repeat an update the Worker already started: skip when another
  # update ran within the last 4 hours, is still running, or finished in the last hour.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/update.yml/runs?per_page=20" --jq '
            [.workflow_runs[] | select(.id != ${{ github.run_id }} and (.event == "workflow_dispatch" or .event == "schedule"))
             | select(.status != "completed"
                      or (now - ((.run_started_at // .created_at) | fromdateiso8601)) < 14400
                      or (now - (.updated_at | fromdateiso8601)) < 3600)] | length')
          echo "other recent or running updates: $n"
          if [ "$n" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355             # GitHub's limit is 6 h; crawling stops on its own before that
    env:
      AIRSOFT_DB: ${{ github.workspace }}/data/airsoft.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the crawler handles untrusted shop data; keep no GitHub token on disk

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The database (offers, price history, crawl progress) lives in the Actions cache between runs.
      - name: Restore database
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: data/
          key: airsoft-db-${{ github.run_id }}
          restore-keys: airsoft-db-

      - name: Download prices
        if: github.event_name != 'push'
        run: |
          mkdir -p data
          python -m airsoftcompare update --batch --max-minutes "${{ github.event.inputs.crawl_minutes || '220' }}"

      - name: Cache product photos
        if: github.event_name != 'push'
        run: python -m airsoftcompare thumbs --max-minutes 40

      - name: Translate product names
        if: github.event_name != 'push'
        run: python -m airsoftcompare translate --max-minutes 40

      - name: Save database
        if: always() && github.event_name != 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: data/
          key: airsoft-db-${{ github.run_id }}

      # A code push publishes from the cached database; re-sort it with the pushed category rules
      # first (not saved: the next scheduled run does that itself).
      - name: Re-sort categories
        if: github.event_name == 'push'
        run: mkdir -p data && python -m airsoftcompare rematch

      - name: Translate a sample for the preview
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/preview/')
        run: python -m airsoftcompare translate --max-minutes 12

      - name: Build site
        run: mkdir -p data && python -m airsoftcompare export dist

      - name: Publish to Cloudflare Pages
        if: github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Small photo copies first (three projects: Pages allows 20 000 files each), then the site.
          preCommands: |
            for p in compairsoft compairsoft-img-0 compairsoft-img-1 compairsoft-img-2; do npx wrangler pages project create $p --production-branch=main || true; done
          command: |
            pages deploy dist-images/img-0 --project-name=compairsoft-img-0 --branch=main --commit-dirty=true
            pages deploy dist-images/img-1 --project-name=compairsoft-img-1 --branch=main --commit-dirty=true
            pages deploy dist-images/img-2 --project-name=compairsoft-img-2 --branch=main --commit-dirty=true
            pages deploy dist --project-name=compairsoft --branch=main --commit-dirty=true

      # A preview/* branch goes to its own address (https://<branch>.compairsoft.pages.dev);
      # the live site and the photo projects are left alone.
      - name: Publish preview
        if: startsWith(github.ref, 'refs/heads/preview/')
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=compairsoft --branch=${{ github.ref_name }} --commit-dirty=true
