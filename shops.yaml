# Airsoft Compare – shop list
#
# Each shop is read in one of two ways:
#
#   type: feed      – the shop's product XML feed (Heureka, Zboží.cz or Google Merchant format).
#                     Fast and complete: one download = whole catalogue. Best option.
#   type: sitemap   – crawls product pages listed in the shop's sitemap and reads the
#                     schema.org product data embedded in each page. Works for almost any
#                     shop but is slow (one page per request_delay seconds).
#
# Not sure which works for a shop?  Run:   python -m airsoftcompare probe https://www.some-shop.cz
# It tries the usual feed addresses and sample product pages, then prints a block to paste here.

settings:
  site_url: https://www.compairsoft.eu   # used in the sitemap for search engines
  contact_email: contact@compairsoft.eu                       # shown on the privacy page; an address you read
  image_hosts:                            # small photo copies, one Pages project each (20 000 files max per project)
    - https://compairsoft-img-0.pages.dev
    - https://compairsoft-img-1.pages.dev
    - https://compairsoft-img-2.pages.dev
  database: airsoft.db
  base_currency: CZK            # all prices are converted to this for comparison
  exchange_rates:               # 1 unit of currency = N base_currency (update now and then)
    EUR: 25.0
    PLN: 5.9
  request_delay: 1.5            # seconds between requests to the same shop – be polite
  respect_robots: true          # obey robots.txt when crawling pages
  match_threshold: 90           # 0-100, lower = more aggressive cross-shop matching
  recrawl_hours: 20             # sitemap shops: don't re-download pages fetched more recently
  parallel_shops: 12            # shops processed at the same time (each host is still rate-limited)

shops:
  # ---- Heureka XML feeds: whole catalogue in one download ----
  - name: Airsoft Online
    url: https://www.airsoft-online.cz
    type: feed
    feed_url: https://www.airsoft-online.cz/heureka.xml

  - name: AirsoftShop
    url: https://airsoftshop.cz
    type: feed
    feed_url: https://airsoftshop.cz/heureka.xml

  - name: AirsoftGuns
    url: https://www.airsoftguns.cz
    type: feed
    feed_url: https://www.airsoftguns.cz/export/heureka.xml

  # Army & outdoor shop (clothing, boots, pouches, gloves); affiliate programme on CJ (7 %)
  - name: E-armyshop
    url: https://www.e-armyshop.cz
    type: feed
    feed_url: https://www.e-armyshop.cz/heureka/export/products.xml
    timeout: 120                # a 13 MB feed

  # ---- Crawled from sitemaps (one page per request_delay). If a shop shares its
  # Heureka feed URL, switch it to `type: feed` – it updates in seconds instead of hours.
  - name: AirsoftPro
    url: https://www.airsoftpro.cz
    type: sitemap
    timeout: 180                # its sitemap is generated on the fly and is slow
    exclude: '/(blog|clanky|novinky|kontakt|kosik|obchodni-podminky|search|vyhledavani)'
    max_pages: 4000

  - name: Anareus
    url: https://www.anareus.cz
    type: sitemap
    sitemap_url: https://www.anareus.cz/3_cs_0_sitemap.xml   # Czech only; gb/sk are copies
    include: '/cs/[^/]+/\d+-[^/]+\.html$'                    # product pages: /cs/<category>/<id>-<name>.html
    max_pages: 12000

  - name: Army Airsoft
    url: https://www.army-airsoft.cz
    type: sitemap
    exclude: '/(znacka|blog|clanky|kontakt|kosik|obchodni-podminky)/'
    title_strip: '\s+(?:Airsoft|Army shop)?\s*-\s*Army-Airsoft\.cz\s*$'
    max_pages: 20000

  - name: Airsoft Morava
    url: https://www.airsoftmorava.cz
    type: sitemap
    exclude: '/(znacka|blog|clanky|kontakt|kosik|obchodni-podminky)/'
    max_pages: 5000

  - name: Fallens Airsoft
    url: https://www.fallens-airsoft.cz
    type: sitemap
    exclude: '/cs/(news|contactus|blog|clanky)|nase-zkusenosti'
    max_pages: 2000

  - name: Colosus                 # also sells bows, knives, swords – those land in "Other"
    url: https://www.colosus.cz
    type: sitemap
    exclude: 'obchodni-podminky|/zeta/'
    max_pages: 12000

  - name: Catus Airsoft
    url: https://www.catus-airsoft.cz
    type: sitemap
    exclude: '/(blog|o-nas|doprava|platba|kontakt)'
    max_pages: 22000

  - name: Novritsch EU
    url: https://eu.novritsch.com
    type: sitemap
    include: '/product/'
    currency: EUR
    max_pages: 2000

  # Not added:
  #  - actionshop.cz: product pages carry no machine-readable price/stock; ask them for a Heureka feed.
  #  - evike-europe.com: refuses automated requests (HTTP 403).

  # ---- Examples ----

  - name: Example feed shop
    url: https://www.example-airsoft.cz
    type: feed
    feed_url: https://www.example-airsoft.cz/heureka.xml
    enabled: false              # set to true (or delete the line) once the URL is real

  - name: Example crawled shop
    url: https://www.example-airsoft.sk
    type: sitemap
    # sitemap_url: https://www.example-airsoft.sk/sitemap.xml   # default: read from robots.txt
    include: '/[^/]+\.html$'    # regex – only URLs that look like product pages
    exclude: '/(blog|clanky|kontakt|kosik)/'
    max_pages: 3000             # cap per run
    currency: EUR               # used when a page/feed doesn't say
    enabled: false
